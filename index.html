<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href='style.css'>
    <link rel="icon" type="image/x-icon" href="images/favicon_3.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <title>2048 Game</title>
</head>

<body>
    <header>
        <h1>2048</h1>
        <button id="restartBtn">New Game</button>
        <hr>
    </header>
    <main>
        <section class="scoreSection">
            <h2>Score: <span id="score">0</span></h2>
        </section>
    </main>
    <footer>
        <button id="backtBtn">Undo</button>
        <button id="leadersBtn">View Leaders</button>
    </footer>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/game.js"></script>
    <script type="module" src="js/elements.js"></script>
</body>

</html>
